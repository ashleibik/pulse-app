<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse: allow access</title>
<!--
  The sign-in + consent page for the Claude connector (Phase 8).

  When you add the Pulse connector in Claude, Supabase Auth sends your browser here with an
  `authorization_id`. This page signs you in to YOUR Pulse account and asks whether Claude may
  read your summaries. It talks only to your own Supabase project.

  Setup: put your project URL and publishable ("anon") key into CONFIG below, then host this one
  file anywhere static (see supabase/README.md). The publishable key is designed to be public:
  it grants nothing by itself, Row Level Security does the protecting. Never put the
  service-role key or any other secret in this file.
-->
<style>
  :root { --bg: #FFFFFF; --surface: #F5F5F5; --border: #EAEAEA; --fg: #111111; --secondary: #6B6B6B; --on-fg: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --surface: #111111; --border: #1F1F1F; --fg: #FFFFFF; --secondary: #8A8A8A; --on-fg: #000000; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, "SF Pro Text", Inter, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 56px 24px; display: grid; gap: 24px; }
  h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.024em; margin: 0; }
  p { margin: 0; color: var(--secondary); }
  .facts { display: grid; border-top: 1px solid var(--border); }
  .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .facts b { text-align: right; overflow-wrap: anywhere; }
  form, .actions { display: grid; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--secondary); }
  input { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  button { font: inherit; font-weight: 700; height: 52px; border: 0; border-radius: 999px; cursor: pointer; background: var(--surface); color: var(--fg); }
  button.primary { background: var(--fg); color: var(--on-fg); }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  #error { color: var(--fg); font-weight: 700; }
  small { font-size: 13px; color: var(--secondary); }
</style>
</head>
<body>
<main>
  <h1 id="title">Pulse</h1>
  <p id="lead">Loading…</p>

  <form id="login" hidden>
    <label for="email">Email<input id="email" type="email" autocomplete="username" required></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" id="login-button" type="submit">Sign in</button>
  </form>

  <section id="consent" hidden>
    <div class="facts">
      <div><span>App</span><b id="client"></b></div>
      <div><span>Sends you back to</span><b id="redirect"></b></div>
      <div><span>Can do</span><b>Read your summaries</b></div>
      <div><span>Cannot do</span><b>Change or delete anything</b></div>
    </div>
    <div class="actions" style="margin-top:24px">
      <button class="primary" id="approve">Allow</button>
      <button id="deny">Don't allow</button>
    </div>
  </section>

  <p id="error" role="alert" hidden></p>
  <small>Only allow this if you just added the Pulse connector yourself. You can remove access any time in your Supabase project (Authentication, OAuth Apps).</small>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
  // ---- Fill these two in (see supabase/README.md). Both are safe to publish. ----
  const CONFIG = {
    url: "https://YOUR-PROJECT-REF.supabase.co",
    publishableKey: "YOUR-PUBLISHABLE-KEY",
  };

  const $ = (id) => document.getElementById(id);
  const show = (id, visible) => { $(id).hidden = !visible; };
  const fail = (message) => { $("error").textContent = message; show("error", true); };

  const authorizationId = new URLSearchParams(location.search).get("authorization_id");
  const client = supabase.createClient(CONFIG.url, CONFIG.publishableKey);

  async function loadRequest() {
    show("login", false);
    const { data, error } = await client.auth.oauth.getAuthorizationDetails(authorizationId);
    if (error || !data) return fail(error ? error.message : "This request is no longer valid. Start again from Claude.");
    // Already allowed earlier: Supabase gives the way back straight away.
    if (!("authorization_id" in data) && data.redirect_url) { location.href = data.redirect_url; return; }

    // textContent (never innerHTML): the app name comes from the app itself and must not be trusted.
    $("client").textContent = data.client && data.client.name ? data.client.name : "Unknown app";
    let host = data.redirect_uri || "";
    try { host = new URL(data.redirect_uri).host; } catch (_) { /* show it as it came */ }
    $("redirect").textContent = host;
    $("title").textContent = "Allow access?";
    $("lead").textContent = "An app wants to read your Pulse recovery, sleep, strain and workout summaries.";
    show("consent", true);
  }

  async function decide(approve) {
    $("approve").disabled = $("deny").disabled = true;
    const call = approve ? client.auth.oauth.approveAuthorization(authorizationId)
                         : client.auth.oauth.denyAuthorization(authorizationId);
    const { data, error } = await call;
    if (error || !data || !data.redirect_url) {
      $("approve").disabled = $("deny").disabled = false;
      return fail(error ? error.message : "Something went wrong. Start again from Claude.");
    }
    location.href = data.redirect_url;
  }

  async function start() {
    if (CONFIG.url.includes("YOUR-PROJECT-REF")) return fail("This page is not set up yet: fill in CONFIG in index.html.");
    if (!authorizationId) {
      $("lead").textContent = "Open this page from Claude, by adding the Pulse connector.";
      return;
    }
    const { data } = await client.auth.getSession();
    if (data.session) return loadRequest();
    $("title").textContent = "Sign in to Pulse";
    $("lead").textContent = "Use the same email and password as in the Pulse app.";
    show("login", true);
  }

  $("login").addEventListener("submit", async (event) => {
    event.preventDefault();
    show("error", false);
    $("login-button").disabled = true;
    const { error } = await client.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    $("login-button").disabled = false;
    if (error) return fail("That email or password is not right.");
    loadRequest();
  });
  $("approve").addEventListener("click", () => decide(true));
  $("deny").addEventListener("click", () => decide(false));
  start();
</script>
</body>
</html>
