# Builds Pulse on a GitHub-hosted Mac and takes iPhone simulator screenshots of every screen.
# Lets us develop on Windows and still compile + see the real SwiftUI app.
#
# Download results:  gh run download --name screenshots     (or the Actions tab on github.com)
# Cost note: macOS runner minutes count 10x against the free private-repo allowance, so this only
# runs on pushes that touch app code, or by hand (workflow_dispatch).

name: iOS build & screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "shared/**"
      - "re-toolkit/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read     # least privilege: the job only needs to read the code

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python toolkit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: re-toolkit
        run: pip install -r requirements.txt
      - name: Test
        working-directory: re-toolkit
        run: python -m pytest -q

  core:
    name: PulseCore tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version && xcodebuild -version
      - name: Test
        working-directory: ios/PulseCore
        run: swift test 2>&1 | tee ../../core-tests.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests-log
          path: core-tests.log

  app:
    name: Build app + screenshots
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          NAME=$(xcrun simctl list devices available -j | jq -r --arg u "$UDID" '.devices[][] | select(.udid == $u) | .name')
          echo "Using $NAME ($UDID)"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ios/Pulse.xcodeproj -scheme Pulse \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Pulse/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/Pulse.app
          BID=dev.pulse.app
          mkdir -p screenshots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"

          shot() {   # shot <file> <launch args...>
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" "${@:3}"
            sleep "$2"
            xcrun simctl io "$UDID" screenshot "screenshots/$1.png"
          }

          # The simulator is in LIGHT mode here. Today is in the new Mono design (light + dark).
          # The other screens are still the old dark design and must stay dark by themselves
          # (legacyDarkTheme / legacyDarkSheet), so capturing them in light mode tests that.
          shot 0-welcome 6
          # First real launch generates 30 days of demo data (debug build: give it time).
          shot 1-today-light 45 -hasSeenWelcome YES -screenshotTab today
          shot 1-today-light-lower 8 -hasSeenWelcome YES -screenshotTab today -screenshotScroll bottom
          shot 2-recovery 8 -hasSeenWelcome YES -screenshotTab today -screenshotRoute recovery
          shot 3-sleep 8 -hasSeenWelcome YES -screenshotTab sleep
          shot 4-activity 8 -hasSeenWelcome YES -screenshotTab activity
          shot 5-trends 8 -hasSeenWelcome YES -screenshotTab trends
          shot 6-settings 8 -hasSeenWelcome YES -screenshotTab today -screenshotRoute settings

          xcrun simctl ui "$UDID" appearance dark
          shot 1-today-dark 8 -hasSeenWelcome YES -screenshotTab today
          shot 1-today-dark-lower 8 -hasSeenWelcome YES -screenshotTab today -screenshotScroll bottom
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
