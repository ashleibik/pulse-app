# XcodeGen spec: generates Pulse.xcodeproj on a Mac.
#
#   brew install xcodegen
#   cd ios && xcodegen
#   open Pulse.xcodeproj
#
# Why XcodeGen instead of committing Pulse.xcodeproj? The .xcodeproj format is a huge machine-
# generated file that's easy to corrupt by hand and causes merge conflicts. This YAML is short,
# readable, and reviewable, and the .xcodeproj is regenerated from it (and gitignored).

name: Pulse
options:
  bundleIdPrefix: dev.pulse           # change to your own reverse-domain prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PulseCore:
    path: PulseCore

targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
      - path: Shared
    dependencies:
      - package: PulseCore
      - target: PulseWidget          # embedded in the app (PlugIns/PulseWidget.appex)
    info:
      # Merged with the keys generated from INFOPLIST_KEY_* below.
      path: Pulse/Info.plist
      properties:
        # bluetooth-central: the band connection is kept in the background (and restored by iOS).
        # fetch + processing + the task IDs: iOS wakes the app to pull band data (App/BackgroundSync.swift).
        UIBackgroundModes: [bluetooth-central, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [dev.pulse.app.sync, dev.pulse.app.nightly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pulse.app
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Pulse connects to your band over Bluetooth to read your heart rate, sleep and activity data."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Pulse backs up your sleep, heart rate, resting heart rate, HRV and workouts to Apple Health."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Pulse reads Apple Health only to avoid saving the same sleep, heart rate or workout twice."
        CODE_SIGN_ENTITLEMENTS: Pulse/Pulse.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # DEVELOPMENT_TEAM is set in Xcode (Signing & Capabilities), never committed.

  # Home screen + lock screen widget. Reads the snapshot the app writes into the shared App Group.
  PulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PulseWidget
      - path: Shared
    info:
      path: PulseWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pulse.app.widget
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        CODE_SIGN_ENTITLEMENTS: PulseWidget/PulseWidget.entitlements
        SKIP_INSTALL: YES
